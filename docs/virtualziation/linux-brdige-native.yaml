# Linux bridge setup 

Preparation 

- adding new interface to SNO (net1, ens19 ) 
- creating new namesapce for VM testing "vm-deployment-test"
- nmstate operator must be available to create nncp ( node network configuration policy ) 




```
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: br1-ens19
spec:
  desiredState:
    interfaces:
      - name: br1
        type: linux-bridge
        state: up
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: ens19
```
	
```	
oc get nncp 
oc get nnce 
```

```
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-lan
  namespace: vm-deployment-test
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br1
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vm-lan",
      "type": "bridge",
      "bridge": "br1",
      "macspoofchk": true,
      "ipam": {}
    }
```
