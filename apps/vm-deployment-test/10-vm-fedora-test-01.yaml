# Najprostsza VM-ka testowa (OpenShift Virtualization):
#  - obraz: Fedora z wbudowanego boot source (DataSource "fedora" w openshift-virtualization-os-images)
#  - zasoby: instancetype u1.small = 1 vCPU / 2Gi RAM (preferencja "fedora" wymaga min. 2Gi)
#  - dysk: 30Gi klon boot source'a na domyślnym StorageClass (lvms-vg1, thin provisioning)
#  - sieć: tylko domyślna sieć podów (masquerade/NAT) - bez zależności od bridge'a br-vm / NAD vm-l2
#  - logowanie: user "fedora", hasło "fedora123" (cloud-init), działa na konsoli i po SSH
#
# Dostęp po wdrożeniu:
#   virtctl console -n vm-deployment-test fedora-test-01     (wyjście: Ctrl+])
#   virtctl ssh     -n vm-deployment-test fedora@fedora-test-01
# W VM-ce (sieć masquerade: VM 10.0.2.2, brama 10.0.2.1):
#   ping -c 3 $(ip route | awk '/default/ {print $3}')
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-test-01
  namespace: vm-deployment-test
  labels:
    app: fedora-test-01
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: fedora-test-01-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        kubevirt.io/domain: fedora-test-01
        app: fedora-test-01
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: fedora-test-01-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: fedora
              password: fedora123
              chpasswd:
                expire: false
              ssh_pwauth: true
