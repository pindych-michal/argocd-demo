# NetworkAttachmentDefinition - sieć L2 dla VM-ek przez bridge "br-vm" (CNV bridge CNI).
# W VM: spec.template.spec.networks[].multus.networkName: vm-l2
# Dla VLAN-ow dodaj "vlan": <id> w config (bridge musi mieć wtedy VLAN filtering
# lub osobny bridge per VLAN).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-l2
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-vm
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vm-l2",
      "type": "bridge",
      "bridge": "br-vm",
      "macspoofchk": true,
      "ipam": {}
    }
