# NodeNetworkConfigurationPolicy - tworzy Linux bridge "br-vm" na wybranych node'ach.
# Do tego bridge'a bedą podpinane VM-ki (L2) przez NetworkAttachmentDefinition.
#
# !!! PRZED SYNC-iem dopasuj:
#   - port (nazwa fizycznego NIC-a): sprawdź `oc get nns <node> -o yaml`
#   - nodeSelector (na SNO zamień na kubernetes.io/hostname: <node>)
# Błędna nazwa interfejsu => NNCE w stanie Degraded, ale node nie traci sieci
# (nmstate robi rollback po timeoucie).
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: br-vm-policy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  maxUnavailable: 1
  desiredState:
    interfaces:
      - name: br-vm
        description: Linux bridge for VM L2 networks
        type: linux-bridge
        state: up
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: ens1f1   # <-- dedykowany NIC pod VM-ki (nie ten z API/ingress!)
