apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-deployment-test
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pindych-michal/argocd-demo.git
    targetRevision: main
    path: apps/vm-deployment-test
  destination:
    server: https://kubernetes.default.svc
    namespace: vm-deployment-test
  syncPolicy:
    # selfHeal: zatrzymanie VM-ki z konsoli (runStrategy: Halted) zostanie cofnięte przez Argo -
    # żeby wyłączyć VM-kę na stałe, zmień runStrategy w repo.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
